[project]
name = "linuxstreamdeck"
version = "0.2.7"
description = "Software for the Elgato Stream Deck on Linux with full OBS Studio integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JavocSoft", email = "javocsoft@gmail.com" }]
dependencies = [
    "streamdeck>=0.9.5",
    "pillow>=10.0",
    "obsws-python>=1.7",
]

[project.scripts]
linuxstreamdeck = "linuxstreamdeck.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linuxstreamdeck*"]

[tool.setuptools.package-data]
linuxstreamdeck = ["assets/icons/*.ttf", "assets/icons/*.json", "assets/icons/LICENSE*"]
