[project]
name = "linuxstreamdeck"
version = "0.3.8"
description = "Software for the Elgato Stream Deck on Linux with full OBS Studio integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JavocSoft", email = "javocsoft@gmail.com" }]
dependencies = [
    "streamdeck>=0.9.5",
    "pillow>=10.0",
    "obsws-python>=1.7",
]

[project.scripts]
linuxstreamdeck = "linuxstreamdeck.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linuxstreamdeck*"]

[tool.setuptools.package-data]
linuxstreamdeck = [
    "assets/icons/*.ttf", "assets/icons/*.json", "assets/icons/LICENSE*",
    "assets/fonts/*.ttf", "assets/fonts/LICENSE*",
    "assets/games/mole_smash/*.png", "assets/games/mole_smash/*.wav",
    "assets/games/mole_smash/LICENSE*",
    "assets/games/circuit_breaker/*.wav", "assets/games/circuit_breaker/LICENSE*",
    "assets/games/pulse_memory/*.wav", "assets/games/pulse_memory/LICENSE*",
    "assets/games/memory_match/*.wav", "assets/games/memory_match/LICENSE*",
    "assets/games/minesweeper/*.wav", "assets/games/minesweeper/LICENSE*",
    "assets/games/tic_tac_toe/*.wav", "assets/games/tic_tac_toe/LICENSE*",
    "assets/games/mastermind/*.wav", "assets/games/mastermind/LICENSE*",
    "assets/games/neon_relay/*.wav", "assets/games/neon_relay/LICENSE*",
]
